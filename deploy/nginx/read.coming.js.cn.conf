# Example nginx site for https://read.coming.js.cn.
# Use this only when the server does not already have a server block for the
# domain. Keep the existing ssl_certificate lines, then:
#   sudo nginx -t && sudo systemctl reload nginx
#
# The Node app listens on 127.0.0.1:3210 (systemd unit read.service).

server {
    listen 80;
    server_name read.coming.js.cn;
    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl;
    http2 on;
    server_name read.coming.js.cn;
    # ssl_certificate     /etc/letsencrypt/live/read.coming.js.cn/fullchain.pem;
    # ssl_certificate_key /etc/letsencrypt/live/read.coming.js.cn/privkey.pem;
    client_max_body_size 32m;

    location / {
        proxy_pass http://127.0.0.1:3210;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}
