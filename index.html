<!DOCTYPE html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Hello World</title>
    <style>
      :root {
        color-scheme: light dark;
        --bg: #f6f7f9;
        --fg: #1c1f24;
        --muted: #5c6570;
      }

      @media (prefers-color-scheme: dark) {
        :root {
          --bg: #121417;
          --fg: #f4f6f8;
          --muted: #a3acb8;
        }
      }

      * {
        box-sizing: border-box;
      }

      body {
        margin: 0;
        min-height: 100vh;
        display: grid;
        place-items: center;
        background: var(--bg);
        color: var(--fg);
        font-family: "Segoe UI", "PingFang SC", "Hiragino Sans GB", "Noto Sans SC", "Microsoft YaHei", sans-serif;
      }

      main {
        text-align: center;
        padding: 2rem;
      }

      h1 {
        margin: 0;
        font-size: clamp(2.5rem, 8vw, 4.5rem);
        font-weight: 650;
        letter-spacing: -0.04em;
      }

      p {
        margin: 0.75rem 0 0;
        color: var(--muted);
        font-size: 1.05rem;
      }
    </style>
  </head>
  <body>
    <main>
      <h1>Hello World</h1>
      <p>read.coming.js.cn</p>
    </main>
  </body>
</html>
